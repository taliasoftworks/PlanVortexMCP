name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # El SDK v2 de MCP exige Node >= 20, que es lo que declara `engines`.
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    starts:
        # Que el paquete construido ARRANQUE de verdad. Un fallo de `exports`, un `bin` sin shebang o
        # un import que solo existe en desarrollo no lo ve ningun test unitario: lo ve esto.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # La version vive en cinco sitios y el registro oficial de MCP valida que la de
            # `server.json` case con la del paquete npm. Si no cuadran, la release entra en npm y se
            # cae en el registro, que es donde peor se ve porque ese job va con `continue-on-error`.
            - run: npm run check:version
            # El server.json del registro MCP: su esquema es snake_case y el fallo no se ve leyendo.
            # Las altas de la 0.1.0 y la 0.1.1 murieron por esto, en un job con continue-on-error.
            - run: npm run check:registry
            - run: npm run build
            - name: --version responde
              run: node dist/cli.js --version
            # SIN CREDENCIALES EL SERVIDOR ARRANCA, y eso es lo que se comprueba. Antes esto exigia
            # lo contrario —que el proceso muriera— y ahi estaba el fallo: los directorios (Glama,
            # Smithery) levantan el servidor con CERO variables de entorno para leerle el catalogo,
            # asi que un proceso que exige `client_id` para arrancar sale de ahi como una ficha
            # vacia. Lo que si se exige es que el catalogo no venga vacio y que la primera
            # herramienta que sale a la red explique lo del plan Custom (trampa 15).
            - name: Sin credenciales sirve el catalogo y explica lo del plan Custom
              run: node scripts/introspect.mjs --expect-no-credentials -- node dist/cli.js

            # COMO LO ARRANCA UN USUARIO DE VERDAD, que no es `node dist/...`: se empaqueta, se
            # instala y se ejecuta por el `bin`. Y en un directorio CON UN ESPACIO en el nombre.
            #
            # Esto no es rebuscado, es la reproduccion exacta de un fallo que llego a npm en la
            # 0.1.0: el bin comparaba `process.argv[1]` con `import.meta.url` para decidir si lo
            # habian ejecutado o importado, y `import.meta.url` es una URL, asi que un espacio
            # viaja como `%20` y una tilde como `%C3%A9`. No coincidian, el proceso terminaba con
            # codigo 0 y SIN ESCRIBIR NADA, y `npx planvortex-mcp` se quedaba mudo para cualquiera
            # con un espacio o un acento en su ruta. En Linux y macOS pasaba siempre, porque npm
            # instala el bin como enlace simbolico y ahi los dos valores nunca coinciden.
            #
            # Ningun test unitario ve esto. Este paso si.
            - name: El bin funciona instalado y en una ruta con espacios
              run: |
                  npm pack --pack-destination /tmp
                  mkdir -p "/tmp/con espacio" && cd "/tmp/con espacio"
                  npm init -y >/dev/null
                  npm install /tmp/planvortex-mcp-*.tgz >/dev/null
                  salida=$(./node_modules/.bin/planvortex-mcp --version)
                  if [ -z "$salida" ]; then
                    echo "El bin no imprimio nada. Se ejecuto pero no arranco."
                    exit 1
                  fi
                  echo "El bin responde: $salida"

    docker:
        # QUE LA IMAGEN ARRANQUE Y HABLE MCP. Nada lo comprobaba, y por eso el 2026-09-02 la ficha de
        # Glama salio como «Container exited with code 1 before responding to ping» con tres fallos
        # encadenados dentro: el `ENTRYPOINT` apuntaba a `dist/index.js` —que solo exporta, asi que
        # el contenedor terminaba con codigo 0 y en silencio—, la imagen estaba clavada en `--http`
        # cuando un contenedor de un servidor MCP se arranca por stdio, y sin credenciales el
        # proceso se negaba a arrancar. Ninguno de los tres lo puede ver un test del servidor.
        #
        # Esto es exactamente lo que hace un directorio: construir el Dockerfile, `docker run -i` sin
        # ninguna variable de entorno, y pedir el catalogo.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: docker build -t planvortex-mcp:ci .
            - name: La imagen habla MCP por stdio sin entorno
              run: node scripts/introspect.mjs --expect-no-credentials -- docker run -i --rm planvortex-mcp:ci
            # El modo `--http` de la fase 6, que es la otra mitad del Dockerfile y la que nunca
            # habia funcionado dentro de Docker.
            - name: El modo --http responde desde el contenedor
              run: |
                  docker run -d --rm --name pvmcp -p 127.0.0.1:3000:3000 \
                    -e PLANVORTEX_CLIENT_ID=x -e PLANVORTEX_CLIENT_SECRET=y \
                    -e PLANVORTEX_MCP_AUTH_TOKEN=secreto \
                    planvortex-mcp:ci --http --host 0.0.0.0
                  for intento in $(seq 1 20); do
                    curl -sf http://127.0.0.1:3000/health && break || sleep 1
                  done
                  curl -sf http://127.0.0.1:3000/health | grep -q '"ok":true'
                  # TRAMPA 12: el puerto lleva dentro el client_secret, asi que sin token es un 401.
                  codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:3000/mcp)
                  test "$codigo" = "401" || { echo "sin token contesto $codigo, no 401"; exit 1; }
                  docker stop pvmcp
            - name: Y se niega a atarse fuera de loopback sin token
              run: |
                  if docker run --rm -e PLANVORTEX_CLIENT_ID=x -e PLANVORTEX_CLIENT_SECRET=y \
                       planvortex-mcp:ci --http --host 0.0.0.0; then
                    echo "Arranco sin PLANVORTEX_MCP_AUTH_TOKEN, y no deberia."
                    exit 1
                  fi

    coverage:
        # Las capas 1 y 2. La 3 (contra un PlanVortex real) y la 4 (eleccion de herramienta) NO estan
        # aqui ni pueden estarlo: una necesita un stack y credenciales, y la otra un modelo.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run test:coverage
